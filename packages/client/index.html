<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Hollowlight</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #04070a;
        color: #eaf2ea;
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      #stage { display: block; image-rendering: auto; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        font-size: 15px;
        line-height: 1.5;
        color: #8fa598;
      }
      noscript { color: #ff9166; }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Hollowlight game view" role="img"></canvas>
    <div id="boot">Loading Verdant Hollow…</div>
    <noscript>Hollowlight needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
